<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Missatge rebut · Sandra Fortanet</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--paper:#F6F5F1;--card:#FFF;--ink:#1E2126;--muted:#6D6F76;--line:#DEDCD4;--blue:#2743C7;--blue-dark:#1D33A0;--marker:#FFE45C}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;
       display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
  .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:44px 38px;max-width:560px;text-align:center}
  .tag{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
  h1{font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:34px;line-height:1.15;margin:10px 0 14px}
  .hl{background:linear-gradient(transparent 55%, var(--marker) 55%, var(--marker) 92%, transparent 92%);padding:0 .06em}
  p{color:var(--muted);font-size:16px;line-height:1.6;margin:0 0 10px}
  a.btn{display:inline-block;margin-top:22px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;
        letter-spacing:.08em;background:var(--blue);color:#fff;text-decoration:none;border-radius:999px;padding:12px 20px}
  a.btn:hover{background:var(--blue-dark)}
</style>
</head>
<body>
  <div class="box">
    <span class="tag">Formulari de contacte</span>
    <h1>Missatge <span class="hl">rebut</span></h1>
    <p>Gràcies per escriure. Et respondré al correu que m'has deixat tan prompte com puga.</p>
    <p>Si és urgent, també em pots escriure directament a sandra@fundacionflors.es.</p>
    <a class="btn" href="/">TORNA A LA PÀGINA</a>
  </div>
</body>
</html>
